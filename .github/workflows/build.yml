# Crimson Desert Seamless Co-op+ builds the DLL with MSVC on Windows, runs the unit
# tests, and uploads CrimsonDesertCoop.asi + configs as a workflow artifact. 
name: Crimson Desert Co-op build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/cdcoop/config | Out-Null
          Copy-Item build/Release/CrimsonDesertCoop.asi out/
          Copy-Item config/*.toml out/cdcoop/config/
          Get-FileHash out/CrimsonDesertCoop.asi -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: CrimsonDesertCoop-msvc
          path: out/

  upstream-cdmp-msvc:
    # The upstream co-op engine (cd-coop-3446) built by its own CMake, to catch MSVC breakage early.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: upstream/cd-coop-3446
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config RelWithDebInfo --parallel
      - run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build mingw-w64
      - run: cmake -S . -B build/linux -G Ninja && cmake --build build/linux && ctest --test-dir build/linux --output-on-failure
      - run: cmake -S . -B build/win -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake && cmake --build build/win
